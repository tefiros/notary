apiVersion: apps/v1
kind: Deployment
metadata:
  name: ter-schema-registry
  namespace: it6g
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ter-schema-registry
  template:
    metadata:
      labels:
        app: ter-schema-registry
    spec:
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z ter-zookeeper 2181; do echo "waiting for zookeeper"; sleep 2; done
              until nc -z ter-kafka 29092; do echo "waiting for kafka"; sleep 2; done
      containers:
        - name: ter-schema-registry
          image: confluentinc/cp-schema-registry:6.1.0
          ports:
            - containerPort: 8081
              name: http
          envFrom:
            - configMapRef:
                name: ter-schema-registry-config
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ter-kafka-connect
  namespace: it6g
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ter-kafka-connect
  template:
    metadata:
      labels:
        app: ter-kafka-connect
    spec:
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z ter-kafka 29092; do echo "waiting for kafka"; sleep 2; done
              until nc -z ter-schema-registry 8081; do echo "waiting for schema registry"; sleep 2; done
        - name: bootstrap-connect-plugins
          image: confluentinc/cp-kafka-connect:6.1.0
          command:
            - bash
            - -c
            - |
              mkdir -p /connectors
              confluent-hub install --no-prompt --component-dir /connectors mdrogalis/voluble:0.3.1
              confluent-hub install --no-prompt --component-dir /connectors confluentinc/kafka-connect-jdbc:5.5.3
              cd /connectors/confluentinc-kafka-connect-jdbc
              curl -fsSL https://cdn.mysql.com/Downloads/Connector-J/mysql-connector-java-8.0.23.tar.gz | tar xz
          volumeMounts:
            - name: ter-connector-plugin
              mountPath: /connectors
      containers:
        - name: ter-kafka-connect
          image: confluentinc/cp-kafka-connect:6.1.0
          ports:
            - containerPort: 8083
              name: http
          envFrom:
            - configMapRef:
                name: ter-kafka-connect-config
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          volumeMounts:
            - name: ter-connector-plugin
              mountPath: /connectors
      volumes:
        - name: ter-connector-plugin
          persistentVolumeClaim:
            claimName: ter-kafka-connect-connectors
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ter-ksqldb
  namespace: it6g
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ter-ksqldb
  template:
    metadata:
      labels:
        app: ter-ksqldb
    spec:
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z ter-kafka 29092; do echo "waiting for kafka"; sleep 2; done
              until nc -z ter-kafka-connect 8083; do echo "waiting for kafka-connect"; sleep 2; done
              until nc -z ter-schema-registry 8081; do echo "waiting for schema registry"; sleep 2; done
      containers:
        - name: ter-ksqldb
          image: confluentinc/ksqldb-server:0.15.0
          ports:
            - containerPort: 8088
              name: http
          envFrom:
            - configMapRef:
                name: ter-ksqldb-config
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ter-postgrest
  namespace: it6g
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ter-postgrest
  template:
    metadata:
      labels:
        app: ter-postgrest
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z ter-postgres 5432; do echo "waiting for postgres"; sleep 2; done
      containers:
        - name: ter-postgrest
          image: postgrest/postgrest:v7.0.2
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: ter-postgrest-config
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"