# ---------------------------------------------------------------
# NEXTONIC — deploys signer-service to the Nextonic environment
# ---------------------------------------------------------------
nextonic:
  stage: nextonic
  image: curlimages/curl:8.18.0
  script:
    - echo "Deploying kafka stack to NEXTONIC"
    - 'curl --fail-with-body -sS -X POST https://ip.sns-itrust6g.com/api/kubernetes/it6g/apply
        -H "Authorization: Bearer $NEXTONIC_API_KEY"
        -H "Content-Type: application/yaml"
        --data-binary "@./k8s/01-zookeeper.yaml"'
    - 'curl --fail-with-body -sS -X POST https://ip.sns-itrust6g.com/api/kubernetes/it6g/apply
        -H "Authorization: Bearer $NEXTONIC_API_KEY"
        -H "Content-Type: application/yaml"
        --data-binary "@./k8s/02-broker.yaml"'
    - 'curl --fail-with-body -sS -X POST https://ip.sns-itrust6g.com/api/kubernetes/it6g/apply
        -H "Authorization: Bearer $NEXTONIC_API_KEY"
        -H "Content-Type: application/yaml"
        --data-binary "@./k8s/03-schema-registry.yaml"'
    - 'curl --fail-with-body -sS -X POST https://ip.sns-itrust6g.com/api/kubernetes/it6g/apply
        -H "Authorization: Bearer $NEXTONIC_API_KEY"
        -H "Content-Type: application/yaml"
        --data-binary "@./k8s/04-kafka-connect.yaml"'
    - 'curl --fail-with-body -sS -X POST https://ip.sns-itrust6g.com/api/kubernetes/it6g/apply
        -H "Authorization: Bearer $NEXTONIC_API_KEY"
        -H "Content-Type: application/yaml"
        --data-binary "@./k8s/05-postgres.yaml"'
    - 'curl --fail-with-body -sS -X POST https://ip.sns-itrust6g.com/api/kubernetes/it6g/apply
        -H "Authorization: Bearer $NEXTONIC_API_KEY"
        -H "Content-Type: application/yaml"
        --data-binary "@./k8s/06-postgrest.yaml"'
    - echo "Deploying signer-service to NEXTONIC"
    - 'curl --fail-with-body -sS -X POST https://ip.sns-itrust6g.com/api/kubernetes/it6g/apply
        -H "Authorization: Bearer $NEXTONIC_API_KEY"
        -H "Content-Type: application/yaml"
        --data-binary "@./k8s/signer-service.yaml"'
  tags:
    - k8s-it6g-gitlab-runner
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
 